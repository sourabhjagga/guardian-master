version: "3.8"
services:
  guardian:
    image: sourabhjagga/guardian-master:latest
    environment:
      GUARDIAN_COOLIFY_API: ${GUARDIAN_COOLIFY_API}
      GUARDIAN_COOLIFY_TOKEN: ${GUARDIAN_COOLIFY_TOKEN}
      GUARDIAN_GITHUB_TOKEN: ${GUARDIAN_GITHUB_TOKEN:-}
      GUARDIAN_DB: ${GUARDIAN_DB:-/data/guardian.db}
      PORT: ${PORT:-8000}
    volumes:
      - guardian_data:/data
    ports:
      - "${PORT:-8000}:8000"
volumes:
  guardian_data:
